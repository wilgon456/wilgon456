<svg xmlns="http://www.w3.org/2000/svg" width="400" height="132" viewBox="0 0 400 132" role="img" aria-label="AI CLI Auto Manager">
<style>
.t{font:600 17px 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Ubuntu, sans-serif;fill:#70a5fd}
.d{font:400 13px 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Ubuntu, sans-serif;fill:#c0caf5}
.m{font:400 12px 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Ubuntu, sans-serif;fill:#a9b1d6}
.c{animation:in .6s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<rect width="400" height="132" rx="12" fill="#1a1b27"/>
<rect width="400" height="4" rx="2" fill="url(#g)"/>
<g class="c">
<text x="25" y="40" class="t">AI CLI Auto Manager</text>
<text x="25" y="70" class="d">AI 코딩 CLI를 정해진 때 안전하게 업데이트하고 남은</text><text x="25" y="89" class="d">찌꺼기를 치웁니다.</text>
<circle cx="31" cy="110" r="6" fill="#4ea1ff"/><text x="43" y="114" class="m">PowerShell</text><text x="122" y="114" class="m">★ 4</text><text x="158" y="114" class="m">⑂ 1</text>
</g>
</svg>
